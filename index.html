"溫室氣體減量目標(基準年_目標年_數值原文)": "本公司依據科學基礎減量目標倡議組織（Science Based Targets initiative, SBTi）方法學，設定中長期溫室氣體減量目標，並於 2024 年通過 SBTi 目標驗證。\n\n本公司以 2019 年為範疇一及範疇二溫室氣體減量基準年，基準年排放量分別為：範疇一 19,361.274 公噸 CO₂e、範疇二 349,671.863 公噸 CO₂e，合計 369,033.137 公噸 CO₂e。本公司承諾範疇一及範疇二至 2030 年較基準年減少 50.68%，並至 2050 年較基準年減少 90%。\n\n本公司以 2021 年為範疇三溫室氣體減量基準年，基準年排放量為 28,337,097.881 公噸 CO₂e。本公司承諾範疇三至 2030 年較基準年減少 25%，並至 2050 年較基準年減少 90%。\n\n本公司將持續透過能源效率提升、製程節能改善、再生能源使用、供應鏈減碳合作及價值鏈排放管理等措施，推動溫室氣體減量，以逐步達成中長期減碳目標。",
"溫室氣體減量目標_最新達成進度原文": "2025 年範疇一及範疇二排放量合計為 135,330.992 公噸 CO₂e，較 2019 年基準年減少約 63.33%，已逐步展現能源效率提升、節能改善及再生能源使用等減量成效。範疇三方面，本公司持續依資料可取得性及各類別盤查推動進程，擴大盤查範圍並強化價值鏈排放管理，以作為後續減量追蹤與管理之基礎。",

"減量目標原文": "為強化氣候治理與溫室氣體管理成效，並因應上市櫃公司永續發展路徑圖規範(2025年溫室氣體排放量已完成第三方查證尚待查驗單位核證)，本公司針對納入合併財務報告之子公司推動溫室氣體減量計畫，協助子公司導入標準化溫室氣體盤查作業流程，完成範疇1、範疇2排放量盤查與確信，建立完整之碳排放基線資料。\n本公司並依據各事業單位之排放占比、營運性質、所在地法規及營運條件，分別訂定強度目標或絕對減量目標，整體目標涵蓋超過本公司90%溫室氣體排放。目標設定如下：\n(1) 母公司：以2021年為基準年，針對範疇1及範疇2排放設定強度目標，以「噸CO₂e／噸水泥膠結材料」作為管理指標。基準年排放強度為0.853，2025年實際排放強度為0.780，2030年目標降至0.657，2035年目標降至0.485，並以2050年達成淨零碳排為長期目標。\n(2) 子公司：以2021年為基準年，針對範疇3投資排放設定絕對目標，以「噸CO₂e」作為管理指標。基準年排放量為23,059,816噸CO₂e，2025年實際排放量為15,344,020噸CO₂e，2030年目標控制於16,101,635噸CO₂e。\n(3) 亞東預拌：以2021年為基準年，針對範疇1及範疇2排放設定強度目標，以「公斤CO₂e／立方米」作為管理指標。基準年排放強度為2.31，2025年實際排放強度為2.08，2030年目標降至1.80，2035年目標降至1.55，並以2050年達成淨零碳排為長期目標。\n註1：本公司於2025年通過SBTi 1.5°C情境目標，故同步修訂基準年、目標值及相關減碳路徑資訊。\n註2：嘉惠電力排放約占本公司總排放量9%，惟嘉惠電力為獨立民營發電廠（Independent Power Producer, IPP），所有發電度數均提供台電公司電網調度使用，性質屬供電單位；用電戶用電所產生之碳排係由用電戶承擔，非由供電單位承擔。",
"達成進度原文": "(1) 母公司：以2021年為基準年，2025年實際排放強度為0.780，達標。\n(2) 子公司：以2021年為基準年，2025年實際排放量為15,344,020噸CO₂e，達標。\n(3) 亞東預拌：以2021年為基準年，2025年實際排放強度為2.08，達標。"

"達成進度原文": "本公司 2025 年度實績對齊 SBTi 1.5° C 路徑。2025 年新唐範疇一與範疇二合計排放量為 109,466 噸 CO2e，區域分布如下：臺灣 46,658 噸 CO2e（約 42.6%）、日本 61,421 噸 CO2e（約 56.1%）、其他地區 1,388 噸 CO2e（約 1.3%）。\n年度減碳績效顯示，製程減排與節能專案於本年度已發揮整體減量效益。\n相對於 SBTi 參考路徑，新唐2023–2025 年之實際減量皆顯著超前目標：\n- 2023 年：實際減碳 26%，對照 SBT 路徑 6%，超前 20 個百分點。\n- 2024 年：實際減碳 38%，對照 SBT 路徑 12%，超前 26 個百分點。\n- 2025 年：實際減碳 46%，對照 SBT 路徑 19%，超前 27 個百分點。\n截至 2025 年底，新唐臺灣與新唐日本之減碳進度均大幅領先 SBTi 路徑，顯示本公司在製程優化、能源效率提升與專案推動方面具備高度的執行力與成效。亦彰顯對永續減碳的長期承諾與治理韌性，並為邁向淨零目標奠定穩健基礎。"

          </div>
          <p style="font-size:12.5px;line-height:1.7;color:var(--text-secondary);margin:8px 0">由上而下，以官方歷史統計與既有預測外推全國總量；綠電部分另新增「公司專屬用電量 × 綠電承諾」的需求端計算框架，與既有全國政策／供給端算法並列。</p>
          <details class="rowdetail">
            <summary>看完整步驟、公式與結果</summary>

              <p class="sec-h">一、2035年總用電量</p>

                <tr><td id="m1-total-trend">官方趨勢推算</td><td><b>3,621億度</b></td><td>經濟部「114年度全國電力資源供需報告」圖3-2官方逐年預測值（非自算複利）；以2025年實際基期2,830.1億度為基礎，2026–2035年均成長2.5%。<a class="link" href="https://www.moeaea.gov.tw/ECW/populace/content/wHandMenuFile.ashx?menu_id=27046&file_id=17091" target="_blank">來源</a></td></tr>

              <p class="sec-h">二、2035年綠電承諾加權占比（待完成）</p>
              <p style="margin:4px 0;font-size:12px">改採下方「公司綠電承諾加權占比」的核心公式，以公司2025年台灣用電量作為權重，搭配其未來綠電承諾。尚未整理完成前，不公布占比或換算綠電量。</p>

                <tr><th>計算方式</th><th>2035綠電占比</th><th>2035綠電量</th><th>狀態</th></tr>
                <tr><td>2025用電量加權的公司綠電承諾</td><td>—</td><td>—</td><td>待整理有2025台灣用電量與未來綠電承諾資料的公司</td></tr>
              </table>

              <p class="sec-h">三、公司綠電承諾加權占比——以2025台灣用電量加權</p>
              <p style="margin:4px 0;font-size:12.5px">這是需求端的綠電承諾比較：以各公司<b>2025年台灣用電量</b>作為權重，計算未來綠電承諾的整體占比。它不需要先推估公司2035年總用電量；公司2035用電量的推算，另由方法3處理。</p>

              <p class="sub-h">核心公式與適用條件</p>
              <table class="crit-table">
                <tr><th>步驟</th><th>公式</th><th>必須符合的條件</th></tr>
                <tr><td>取得公司用電權重</td><td><code class="path">Eᵢ,2025</code></td><td>公司2025年台灣用電量；只使用可對應台灣範圍的數字。</td></tr>
                <tr><td>取得未來綠電承諾</td><td><code class="path">rᵢ,2035</code></td><td>必須是再生能源／綠電占比；2030或2050目標如要換算為2035值，須明列換算假設。</td></tr>
                <tr><td>按用電量加權</td><td><code class="path">R₍2035₎ = Σ(Eᵢ,2025 × rᵢ,2035) ÷ ΣEᵢ,2025</code></td><td>只納入同時有2025台灣用電量與未來綠電承諾資料的公司；缺資料不當作0%。</td></tr>
              </table>
              <p style="margin:6px 0;font-size:12px"><b>白話例子：</b>A公司2025年台灣用電量100度、未來綠電承諾50%；B公司用電量20度、承諾20%。加權後是<b>(100×50%＋20×20%) ÷ (100＋20) = 45%</b>，不是把50%與20%直接平均成35%。這樣用電量大的公司會有較大的影響。</p>

              <p class="sec-h">四、直供／轉供市場需求趨勢（獨立參考）</p>
              <p style="margin:4px 0;font-size:12.5px">本段以已完成的再生能源<b>直供／轉供交易電量</b>，觀察企業可追蹤的綠電採購市場滲透率。它是實際交易趨勢的代理指標，不是全台所有用戶的綠電使用總量；因此不與上方的公司綠電承諾加權結果相加。</p>
              <table class="crit-table">
                <tr><th>年度</th><th>再生能源直供／轉供電量</th><th>全台電力消費量</th><th>可追蹤交易滲透率</th><th>判讀</th></tr>
                <tr><td>2024</td><td><b>29.99 億度</b></td><td>2,838.5 億度</td><td><b>約 1.06%</b></td><td>台電揭露之年度再生能源轉直供總量；作為市場已完成交易的觀測值。</td></tr>
                <tr><td>2025</td><td><b>58.50 億度</b></td><td>2,830.1 億度</td><td><b>約 2.07%</b></td><td>較 2024 年增加約 95%；僅表示直供／轉供管道的交易擴張，不代表全台綠電使用比例。</td></tr>
              </table>
              <p style="margin:6px 0;font-size:12px"><b>計算式：</b><code class="path">直供／轉供滲透率ₜ = 再生能源直供／轉供電量ₜ ÷ 全台電力消費量ₜ</code>。2025 年為 <code class="path">58.50 ÷ 2,830.1 = 2.07%</code>。</p>
              <p class="footnote" style="margin:6px 0 0">使用界線：可用於觀察市場趨勢、與公司承諾法交叉比較；不可把 2.07% 稱為全台綠電使用率，也不可在未掌握買方逐筆資料前與50家公司承諾結果相加。自發自用、單獨憑證宣告與其他綠電商品可能未完整涵蓋，且可能與個別公司揭露重疊。資料來源：<a class="link" href="https://service.taipower.com.tw/mag/Sustainability/2024%E5%B9%B4%E6%B0%B8%E7%BA%8C%E5%A0%B1%E5%91%8A%E6%9B%B8_2507.pdf" target="_blank">台電 2024 永續報告書</a>、<a class="link" href="https://service.taipower.com.tw/csr/esg/services/user-communication-and-management" target="_blank">台電 ESG 資料</a>、<a class="link" href="https://www.moeaea.gov.tw/ECW/populace/content/wHandMenuFile.ashx?menu_id=27046&file_id=17091" target="_blank">114年度全國電力資源供需報告</a>。</p>

              <p class="sub-h">台積電案例：可推算 RE 用電量，不等於可從直轉供總量扣除</p>
              <table class="crit-table">
                <tr><th>報告書揭露</th><th>可作的計算</th><th>可否自 58.50 億度扣除？</th></tr>
                <tr><td>2025 年台灣廠區及采鈺使用再生能源電力 <b>29.8 億度</b>，占同範圍總用電 <b>11.5%</b>。報告書的再生能源使用定義包含自發再生能源、購買再生能源及再生能源憑證。</td><td><code class="path">台灣總用電 ≈ 29.8 ÷ 11.5% = 259.1 億度</code><br>因此可建立「台灣 RE 用電量」資料點：<b>29.8 億度</b>。</td><td><b>不可直接扣除。</b><br>29.8 億度是混合來源，報告書未拆出其中多少度屬直供／轉供；若全數扣除，會把自發自用或憑證也誤當作直轉供。</td></tr>
              </table>
              <p style="margin:6px 0;font-size:12px">這類公司應先標為「<b>可推台灣 RE 用電量、但來源混合</b>」。只有報告書另揭露「台灣 2025 年直供／轉供綠電量 X 度」或可分辨的 PPA 實際交付量，才可成為 <code class="path">58.50 − Σ公司直供／轉供量</code> 的扣除項。<a class="link" href="https://esg.tsmc.com/file/public/2025-TSMC-Sustainability-Report-c.pdf" target="_blank">台積電 2025 永續報告書 p.99</a></p>

              <p class="sub-h">3a. 公司2035年總用電量推算</p>
              <p style="margin:4px 0;font-size:12.5px">公司2035年總用電量屬於<b>方法3</b>的工作，資料基礎是2023→2025年台灣專屬用電量與公司公開揭露的擴產證據。此項推算不代入目前方法1的綠電承諾加權占比；完成後可作為另一項綠電需求量情境。</p>
              <table class="crit-table">
                <tr><th>階段</th><th>公式</th><th>判讀</th></tr>
                <tr><td>證據涵蓋期</td><td><code class="path">Eᵢ,完工年 = Eᵢ,2025 × 產能比例</code></td><td>產能比例只用公司官方揭露；海外擴產不放大台灣用電。</td></tr>
                <tr><td>完工年之後</td><td><code class="path">Eᵢ,2035 = Eᵢ,完工年 × (1 + 公司歷史CAGR)^(2035−完工年)</code></td><td>接續公司自身趨勢，不接回全國均速。</td></tr>
              </table>
              <p style="margin:6px 0;font-size:12px">範例（聯電，示範方法而非已定案的50家總計）：2025年31.17億度；P6廠2026年完工，月產能10萬片→12.75萬片，比例1.275；2023→2025年公司CAGR約4.3%。<br><code class="path">E2026 = 31.17 × 1.275 = 39.74億度</code><br><code class="path">E2035 = 39.74 × (1.043)^9 ≈ 58.06億度</code></p>

              <p class="sub-h">3b. 不確定性以低／中／高情境呈現</p>
              <table class="crit-table">
                <tr><th>情境</th><th>2035公司總用電公式</th><th>用途與限制</th></tr>
                <tr><td>低</td><td><code class="path">Eᵢ,2025 × (1+CAGRᵢ)^10</code></td><td>不採計近期擴產，作為保守下界。</td></tr>
                <tr><td>中</td><td><code class="path">(Eᵢ,2025 × 產能比例) × (1+CAGRᵢ)^(2035−完工年)</code></td><td>採已揭露擴產，完工後回到公司歷史趨勢；為本段主方法。</td></tr>
                <tr><td>高</td><td>完工後先延續有證據支持的高速成長N年，再接公司CAGR。</td><td>N年必須有第二階段擴產、資本支出週期等公司證據；沒有證據時不可虛設高情境。</td></tr>
              </table>

              <p class="sub-h">3c. 綠電承諾的收錄規則</p>
              <ul style="margin:4px 0 8px;padding-left:20px;font-size:12.5px;color:var(--text-secondary);line-height:1.7">
                <li><b>直接採用：</b>公司明確揭露2035綠電／再生能源占比，且邊界可與公司用電對齊。</li>
                <li><b>保留資料點：</b>只有2030目標時，不自動變成2035值；若日後採內插或延伸，必須標為模型假設。</li>
                <li><b>不可換算：</b>只有綠電採購度數、沒有同邊界總用電量時，保留為電量下限或交叉驗證，不轉占比。</li>
                <li><b>缺值處理：</b>未揭露2035綠電承諾者留白，不以0%代替。</li>
              </ul>
              <p class="sub-h">3d. 為什麼可以這樣推？文獻提供的角色與界線</p>
              <p style="margin:4px 0;font-size:12.5px">這兩篇文獻不提供台灣公司2035年用電的答案；它們分別用來檢查「公司擴產」與「單位產品用電」能否分開處理，以及什麼情況下可暫用產能比例作近似。</p>
              <table class="crit-table">
                <tr><th>文獻重點</th><th>參考用途</th><th>限制</th></tr>
                <tr><td><b>EIA 工業需求模型</b><br>工業能源需求同時受活動量（如出貨、產能）、能源強度（每單位活動的耗能）與價格影響；能源強度會隨設備效率改變。</td><td><b>先拆開兩件事：</b><br>公司擴產反映「活動量」變化；歷史用電趨勢與節能措施則協助判斷「每單位產品用電」是否改變。因此，兩者不能混成一個固定倍率。</td><td>這是美國的總體工業模型，不提供任何台灣公司的2035用電量或成長率。其效率改善假設，也未必適用於先進製程或新廠爬坡。</td></tr>
                <tr><td><b>imec IEDM 2023</b><br>以每片晶圓、每平方公分或每顆晶片為單位比較不同技術節點；模型假設同一節點內的廠務效率與產出條件一致。</td><td><b>限定「同節點」才可近似：</b><br>若公司官方資料顯示是在同一製程節點擴產，可暫以產能增加比例作為用電增加的簡化估計，再接回公司自己的歷史趨勢。</td><td>它不是公司實際用電的證明。良率、稼動率、無塵室基載與跨節點升級都會改變結果；遇到這些情況，不能直接按產能比例推算。</td></tr>
              </table>
              <p class="footnote" style="margin:8px 0 0"><b>因此，本研究的順序是：</b>先用公司官方資料確認擴產是否屬同節點，再以公司台灣用電歷史趨勢推估2035總用電，最後才乘上同邊界的綠電承諾。真正代入計算的數字，仍只能來自公司官方揭露。<a class="link" href="https://www.eia.gov/analysis/handbook/pdf/NEMS_Industrial_Demand.pdf" target="_blank">EIA NEMS Industrial Demand Module</a>　<a class="link" href="https://iedm23.mapyourshow.com/mys_shared/iedm23/handouts/28-1_Wed_13242.pdf" target="_blank">imec IEDM 2023</a></p>

            </div>
          </details>

            <h3 style="color:var(--text-primary);text-transform:none;font-size:14px;margin:0">方法2：部門別驅動因子法</h3>
            <span class="pill na">尚未開始</span>
          </div>
          <p style="font-size:12.5px;line-height:1.7;color:var(--text-secondary);margin:8px 0">拆解電力需求結構，捕捉方法1「全國平均成長率」抓不到的產業別異質成長——半導體/AIDC近年成長率遠高於全國平均，一體適用會嚴重失真。</p>
          <details class="rowdetail">
            <summary>看完整步驟、公式與結果</summary>
            <div class="body" style="max-width:none;white-space:normal">
              <p style="margin:8px 0"><b>步驟一：</b>用能源署<b>官方電力消費五大部門分類</b>(非自訂分類)——113年/2024年數據，全國總計2,838億度：</p>
              <table class="crit-table">
                <tr><th>官方部門</th><th>用電量</th><th>占比</th></tr>
                <tr><td>工業部門</td><td>1,566億度</td><td><b>55.2%</b></td></tr>
                <tr><td>住宅部門</td><td>534億度</td><td><b>18.8%</b></td></tr>
                <tr><td>服務業部門</td><td>500億度</td><td><b>17.6%</b></td></tr>
                <tr><td>能源部門</td><td>185億度</td><td><b>6.5%</b></td></tr>
                <tr><td>其他部門</td><td>53億度</td><td><b>1.9%</b></td></tr>
              </table>
              <p style="margin:8px 0"><b>步驟二：</b>工業、服務業占大宗且異質性高，再往下拆一層子類別；子類別的歸屬依<b>行政院主計總處《中華民國行業統計分類》</b>，不是自己隨意分：</p>
              <ul style="margin:4px 0 8px;padding-left:20px;font-size:12.5px;color:var(--text-secondary);line-height:1.7">
                <li><b>工業部門</b>底下：半導體、傳統製造(鋼鐵/石化/水泥/紡織)、其他工業</li>
                <li><b>服務業部門</b>底下：<b>AIDC資料中心</b>(官方分類：大類J資訊及通訊傳播業→中類63資訊服務業→細類6312「資料處理、主機及網站代管服務業」，故歸服務業、不歸工業)、其他服務業</li>
              </ul>
              <p style="margin:8px 0"><b>步驟三：</b>各子類別用自己的成長驅動因子外推到2035年：</p>
              <table class="crit-table">
                <tr><th>子類別</th><th>驅動因子(官方數字)</th></tr>
                <tr><td>半導體<br><span style="color:var(--text-muted);font-weight:400">(工業部門下)</span></td><td>台電官方：2026年520億度→2030年800億度→2035年<b>1,100億度</b>。CAGR(年複合成長率)＝(1100÷520)^(1/9)−1≈<b>8.7%/年</b>(遠高於全國平均2.5%)——假設每年固定成長8.7%、複利9年，520億度滾到1,100億度</td></tr>
                <tr><td>AIDC資料中心<br><span style="color:var(--text-muted);font-weight:400">(服務業部門下)</span></td><td>經濟部供需報告：2035年申請用電容量約1.2GW(另備妥2–3GW餘裕)。換算年發電度數需假設「容量因數」(平均負載÷裝置容量)：台灣無官方專屬統計，改用<b>RAND智庫報告《AI's Power Requirements Under Exponential Growth》</b>(Pilz, Mahmood, Heim)採用之假設——資料中心平均電力使用率<b>60%</b>。<br><code class="path">AIDC年用電度數 = 1.2GW×8,760時×60% ≈ 63.07億度</code></td></tr>
                <tr><td>傳統製造<br><span style="color:var(--text-muted);font-weight:400">(工業部門下)</span></td><td>據報導近年「走弱」，成長率明顯低於電子業；具體數字待查能源署分業別歷史趨勢，暫以GDP成長率代理</td></tr>
                <tr><td>其他工業／其他服務業／住宅／能源部門／其他部門</td><td>暫以GDP成長率／家戶數成長率／維持現況占比代理(占比小或無對應官方驅動因子數字)</td></tr>
              </table>
              <p style="margin:8px 0"><b>步驟四：</b>加總五大部門(含子類別)2035推算值 = 方法2的全國總用電量。</p>
              <p style="margin:8px 0"><b>步驟五：</b>推算綠電量——以半導體子類別為例(REC/PPA市場最集中的子類別)，拆成「頭部」與「長尾」分別給RE%再加權：</p>
              <ul style="margin:4px 0 8px;padding-left:20px;font-size:12.5px;color:var(--text-secondary);line-height:1.7">
                <li>頭部＝方法3已驗證的20家半導體公司，小計362.91億度，占台電官方半導體全產業總量520億度的<b>69.8%</b>(用實際資料反推，非假設)</li>
                <li>長尾＝其餘30.2%(未被列入名單的中小半導體廠)</li>
                <li>頭部RE%：繼承方法3的RE100/SBTi決策樹推算結果</li>
                <li>長尾RE%：繼承方法1的全國政策目標RE%(保守代理，邏輯是中小廠沒有供應鏈壓力去衝綠電)</li>
              </ul>
              <p style="margin:8px 0"><code class="path">半導體RE% = 69.8%×頭部RE% + 30.2%×長尾RE%</code><br><code class="path">半導體綠電量 = 1,100億度 × 半導體RE%</code><br>其他子類別/部門(傳統製造、AIDC、其他工業/服務業、住宅、能源部門、其他部門)綠電量：各自電量 × 假設RE%(參考全國平均或方法1結果)。</p>
              <p style="margin:8px 0"><b>步驟六：</b>加總各部門綠電量 = 方法2的全國綠電量。</p>
              <p class="footnote" style="margin:8px 0 0">限制：70/30頭部長尾權重以2025年基期反推，假設到2035年維持不變；AIDC容量因素借用RAND智庫報告假設(台灣無官方專屬統計)；傳統製造、其他工業/服務業成長率仍待查證能源署分業別歷史趨勢精確數字；能源部門、其他部門(合計占全國8.4%)目前僅簡化為維持現況比例，未另建驅動模型。</p>

              <p class="sec-h">二、50家逐家推算機制(五層決策樹)</p>
              <p style="margin:4px 0;font-size:12.5px">每家公司自己的永續報告書只揭露「減碳目標(RE%)」，不會揭露「2035年用電量」這種前瞻數字，所以無法直接查表，必須用公開的擴產/資本支出/官方或高階主管發言等間接證據換算。以下決策樹由上到下，證據力越強的優先採用：</p>
              <table class="crit-table">
                <tr><th>層級</th><th>採用條件</th><th>算法</th></tr>
                <tr><td><b>①</b></td><td>公司自己同時揭露「現有基期產能」與「新增/目標產能」兩個具體數字，且該產品線能代表公司整體業務(非眾多產品線中的一個利基小類)</td><td>算比例→換算CAGR(1年以上)或"一次性提升比例"(僅1年)→完工/滿載年後接2.5%/年到2035；若查到更後期的第二階段具體數字，串接到最後一個有證據的階段才接2.5%/年</td></tr>
                <tr><td><b>①b</b></td><td>查無公司自揭比例，但有具名可查證來源的量化前瞻估計，優先序：①公司高階主管本人公開發言 ②官方機構(台電/能源署/國發會)針對該公司本身之估計 ③具名國際機構(標普全球等)對該公司之正式報告</td><td>同①算法；多個估計數字差異大時取最保守(最低)值，信心度標「中低」</td></tr>
                <tr><td><b>②</b></td><td>只揭露「新增產能」絕對數字，沒有現有基期</td><td>額外查證現有基期，查到降①；查不到降④</td></tr>
                <tr><td><b>③</b></td><td>公司明確表示「不擴產/縮產/處分產能/設備除役/維持不變」等具體行動陳述(非模糊的"成長趨緩")</td><td>沿用揭露涵蓋年份之持平/下修，之後接2.5%/年</td></tr>
                <tr><td><b>④</b></td><td>其餘情況：查無任何前瞻資訊、只有資本支出/營收成長率無具體產能數字(不論產業別)、只查到海外擴產無台灣本地數字</td><td>全程2.5%/年：2035用電量＝2025用電量×(1.025)^10≈×1.2801</td></tr>

            <p style="margin:8px 0"><b>帕累托法(80/20法則)：</b>「少數關鍵因素貢獻大部分結果」的經驗法則(最早用在義大利80%土地集中在20%人手上)，這裡用來決定142家候選池要「優先查哪幾家」——查一家PDF要花人工時間，142家不可能全查，所以先按估算用電量排序，優先查用電量最大的公司。</p>
            <p style="margin:8px 0"><b>「81.8%」的分母：</b>是<b>142家候選池自己的Step4估算用電量加總(約1,889億度)</b>，不是全台灣總用電量(全台一年約2,700億度以上)。142家排序後，用電量最大的前10家占這142家「自己加總」的81.8%，用來論證「先查前10家、20家最划算」，跟全國用電量無關。</p>

        <h3>每一步為什麼這樣篩？文獻與法規依據</h3>

        <table class="crit-table">
          <tr><th>關卡</th><th>怎麼篩</th><th>為什麼這樣篩(依據)</th></tr>

            <td>先排除完全沒有能源相關揭露的公司(通常代表報告書未涵蓋此議題或格式不符ESG平台結構化欄位)，作為進入候選池的最低門檻。</td>
          </tr>
          <tr>
            <td>196家<br><span style="color:var(--text-muted);font-weight:400">3年皆揭露</span></td>
            <td>2023、2024、2025三個年度皆有RE%數字</td>
            <td>金管會規定2025年起全體上市櫃公司均應編製永續報告書，但實際揭露品質與涵蓋範圍參差不齊；用「連續3年穩定揭露」作代理指標，篩掉揭露不穩定、可能是新報導或資料品質存疑的公司，提高候選池整體可信度。</td>

      <div class="card">
        <h3>「估算年用電量≥20GWh」怎麼算？限制是什麼？</h3>
        <p style="font-size:13px;line-height:1.7;margin:0 0 10px"><b>公式：</b>估算年用電量(度) = 消耗能源總量(GJ) × 外購電力百分比(%) × 277.7778(GJ→kWh係數)。這只是Step4排序/篩選用的粗估值，<b>不是</b>最終報告數字——Step5最終50家用的是每家公司自己揭露的實際數字。</p>
        <details class="rowdetail">
          <summary>常見問題：含不含自產電力？誤差方向？(展開)</summary>
        <table class="crit-table">
          <tr><th>問題</th><th>說明</th></tr>
          <tr><td>含不含自產自用電力(如廠房太陽能)？</td><td><b>不含</b>——這是能源總量裡另一個獨立分類，公式只抓外購電力那塊。但契約容量門檻本質上是「跟電網拉多少電」的概念，不含自產電力反而更貼近立法原意，不是漏洞。</td></tr>
          <tr><td>含不含售電？</td><td>不涉及——公式算的是「消耗」的能源，賣出去的電本來就沒被計入消耗總量，不會重複計算。</td></tr>
          <tr><td>誤差方向？</td><td>只會低估，不會高估——自產電力占比高的公司可能被誤判為「未達門檻」而漏掉，但不會有「明明沒到門檻卻被誤判通過」的情況，屬保守偏誤，可接受。</td></tr>
        </table>
          <p class="footnote">兩層近似疊加：法定門檻本是「契約容量≥5,000瓩」(跟台電的併網容量)，先換算成「年用電量≥20GWh」(用8,760時×負載率0.4~0.5反推)，再套用ESG申報的「消耗能源總量×外購電力%」去對應——兩層都不精確，但這是公開資料能拿到的極限，ESG平台沒有「契約容量」欄位可查。</p>
        </details>
      </div>

      <div class="card">
        <h3>範疇一／二／三是什麼？2035用電/綠電任務需要哪些欄位？</h3>
        <table class="crit-table">
          <tr><th>範疇</th><th>定義</th><th>跟用電的關係</th><th>這個任務需要嗎</th></tr>
          <tr><td>範疇一</td><td>公司直接排放(燃燒燃料、公司車輛、冷媒逸散等)</td><td>幾乎無關(除非自備柴油發電機)</td><td><span class="pill na">不需要</span></td></tr>
          <tr><td>範疇二</td><td>外購電力／蒸汽的間接排放</td><td><b>核心</b>：排放量÷電網排碳係數＝反推用電量，是沒有直接kWh數字時的救援方法(如華通、中鴻)</td><td><span class="pill ok">需要</span>(替代來源)</td></tr>
          <tr><td>範疇三</td><td>供應鏈上下游(採購商品、售出產品使用、員工通勤等)</td><td>是別人的碳footprint，跟公司自己用電無關</td><td><span class="pill na">不需要</span></td></tr>
        </table>
        <p style="font-size:13px;line-height:1.7;margin:10px 0 0"><b>需要欄位優先序：</b>① 公司直接揭露的kWh數字(最準) → ② 消耗能源總量+外購電力%(估算值) → ③ 範疇二排放量+電網排碳係數(反推救援法) → ④ 再生能源使用率/RE100/SBTi(算綠電占比用) → ⑤ 多年度歷史趨勢(推2035成長率用，目前僅收集最新一年，待Step6補齊)。範疇一、範疇三、減量目標原文對這個任務是<b>噪音</b>，「數據瀏覽」分頁會顯示但非必要欄位。</p>
      </div>

        <summary style="cursor:pointer;font-size:16px;font-weight:700">情境二：全台用電年增 3.5% × 半導體高成長 × 台積電 RE80</summary>

          <p style="margin:0 0 10px;font-size:12.5px;color:var(--text-secondary)">目的：以較高的全台用電與半導體成長率進行壓力測試；同樣分為兩個大用戶群覆蓋率版本。此結果是需求端試算，<b>不是</b>官方供需預測。</p>

          <p class="sec-h">一、計算前提與來源</p>
          <table class="crit-table">

  function drawScenarioCharts() {
    const drawLineChart = (targetId, cfg) => {
      const target = document.getElementById(targetId);
      if (!target) return;
      const W = 1120, H = cfg.notes ? 470 : (cfg.rotateTicks ? 430 : 370);
      const legendRows = Math.ceil(cfg.series.length / 3);
      const m = { l: 92, r: 195, t: Math.max(62, 18 + legendRows * 22), b: cfg.notes ? 122 : (cfg.rotateTicks ? 108 : 68) };
      const innerW = W - m.l - m.r, innerH = H - m.t - m.b;
      const vals = cfg.series.flatMap(s => s.values.filter(Number.isFinite));
      const yMax = Math.ceil(Math.max(...vals) / cfg.step) * cfg.step;
      const yMin = Math.floor(Math.min(...vals) / cfg.step) * cfg.step;
      const x = i => m.l + (innerW * i / (cfg.years.length - 1));
      const y = v => m.t + (yMax - v) / (yMax - yMin) * innerH;
      const grid = [];
      for (let v = yMin; v <= yMax; v += cfg.step) {
        const yy = y(v);
        grid.push(`<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke="var(--gridline)" stroke-width="1"/>`);
        grid.push(`<text x="${m.l - 10}" y="${yy + 4}" text-anchor="end" fill="var(--text-secondary)" font-size="11">${v.toLocaleString("zh-TW")}</text>`);
      }
      const xTicks = cfg.years.map((yr, i) => {
        const tx = x(i), ty = m.t + innerH + 20;
        const label = cfg.rotateTicks ? `<text x="${tx}" y="${ty}" transform="rotate(-42 ${tx} ${ty})" text-anchor="end" fill="var(--text-secondary)" font-size="11">${yr}</text>` : `<text x="${tx}" y="${ty}" text-anchor="middle" fill="var(--text-secondary)" font-size="11">${yr}</text>`;
        return `<g><line x1="${tx}" x2="${tx}" y1="${m.t}" y2="${m.t + innerH}" stroke="var(--gridline)" stroke-width="1"/>${label}</g>`;
      }).join("");
      const seriesSvg = cfg.series.map(s => {
        const entries = s.values.map((v, i) => ({ v, i })).filter(d => Number.isFinite(d.v));
        const pts = entries.map(d => `${x(d.i)},${y(d.v)}`).join(" ");
        const marks = entries.map(d => `<circle cx="${x(d.i)}" cy="${y(d.v)}" r="4" fill="var(--card)" stroke="${s.color}" stroke-width="2"><title>${s.name}｜${cfg.years[d.i]}：${d.v.toLocaleString("zh-TW", { maximumFractionDigits: 2 })} 億度</title></circle>`).join("");
        const valueLabels = (s.valueLabelIndices || []).filter(i => Number.isFinite(s.values[i])).map(i => `<text x="${x(i)}" y="${y(s.values[i]) + (s.valueLabelOffset || -10)}" text-anchor="middle" fill="${s.color}" font-size="10" font-weight="700">${Math.round(s.values[i]).toLocaleString("zh-TW")}</text>`).join("");
        const last = entries[entries.length - 1];
        const endLabel = s.endLabel === false ? "" : `<text x="${x(last.i) + 9}" y="${y(last.v) + (s.labelOffset || 4)}" fill="${s.color}" font-size="12" font-weight="700">${s.name} ${Math.round(last.v).toLocaleString("zh-TW")}</text>`;
        return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ` stroke-dasharray="${s.dash}"` : ""}/>${marks}${valueLabels}${endLabel}`;
      }).join("");
      const legend = cfg.series.map((s, i) => `<g transform="translate(${m.l + (i % 3) * 230},${18 + Math.floor(i / 3) * 18})"><line x1="0" x2="20" y1="0" y2="0" stroke="${s.color}" stroke-width="3"${s.dash ? ` stroke-dasharray="${s.dash}"` : ""}/><circle cx="10" cy="0" r="3" fill="var(--card)" stroke="${s.color}" stroke-width="2"/><text x="27" y="4" fill="var(--text-primary)" font-size="12">${s.name}</text></g>`).join("");
      const notes = (cfg.notes || []).map((n, i) => `<text x="${m.l + i * 370}" y="${H - 31}" fill="var(--accent-3)" font-size="12" font-weight="700">${n}</text>`).join("");
      target.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${cfg.aria}" style="display:block;width:100%;max-width:${cfg.maxWidth || "100%"};height:auto;min-height:250px;margin:0 auto"><rect x="${m.l}" y="${m.t}" width="${innerW}" height="${innerH}" fill="none" stroke="var(--gridline)"/>${grid.join("")}${xTicks}${seriesSvg}${legend}<text x="${m.l + innerW / 2}" y="${H - (cfg.notes ? 76 : 20)}" text-anchor="middle" fill="var(--text-secondary)" font-size="12">年度</text><text transform="translate(22 ${m.t + innerH / 2}) rotate(-90)" text-anchor="middle" fill="var(--text-secondary)" font-size="12">用電量（億度）</text>${notes}</svg>`;
    };

    drawLineChart("scenario-semi-chart", {
      aria: "半導體業用電量：情境一與情境二自2025年至2035年的趨勢",
      years: [2025, 2026, 2027, 2028, 2029, 2030, 2035], step: 250, maxWidth: "88%",
      series: [
        { name: "情境一（年增5.7%）", values: [473, 499, 530, 563, 598, 624, 823], color: "var(--accent)", labelOffset: 4, valueLabelIndices: [0,1,2,3,4,5,6], valueLabelOffset: -10, endLabel: false },
        { name: "情境二（年增15.2%）", values: [473, 534, 606, 692, 793, 960, 1947.75], color: "var(--warn)", labelOffset: -8, valueLabelIndices: [1,2,3,4,5,6], valueLabelOffset: 16, endLabel: false }
      ]
    });

    const base = 2830.1;
    const officialEnd = 3621;
    const officialRate = Math.pow(officialEnd / base, 1 / 10) - 1;
    const years = Array.from({ length: 18 }, (_, i) => 2018 + i);
    const actual = [2666.2, 2778.4, 2819.7, 2833.1, 2795.1, 2756.3, 2838.6, 2830.1, null, null, null, null, null, null, null, null, null, null];
    const scenarioOne = years.map((yr, i) => yr < 2025 ? null : base * Math.pow(1 + officialRate, i - 7));
    const scenarioTwo = years.map((yr, i) => yr < 2025 ? null : base * Math.pow(1.035, i - 7));
    drawLineChart("scenario-tw-chart", {
      aria: "全台用電量：情境一與情境二自2025年至2035年的趨勢，並於2035標示綠電量",
      years, step: 250, rotateTicks: true,
      series: [
        { name: "歷年實績", values: actual, color: "var(--text-primary)", labelOffset: 4, valueLabelIndices: [0,2,4,6], valueLabelOffset: -10, endLabel: false },
        { name: "情境一（年增2.5%）", values: scenarioOne, color: "var(--accent)", dash: "6 4", labelOffset: 4, valueLabelIndices: [7,12,17], valueLabelOffset: -10, endLabel: false },
        { name: "情境二（年增3.5%）", values: scenarioTwo, color: "var(--warn)", dash: "6 4", labelOffset: -8, valueLabelIndices: [10,17], valueLabelOffset: 16, endLabel: false }
      ],
      notes: ["2035 綠電｜情境一：1,009–1,148 億度（B–A）", "2035 綠電｜情境二：1,289–1,442 億度（D–C）"]
    });

    const nulls = n => Array(n).fill(null);
    const historicYears = years;
    drawLineChart("scenario-report-chart", {
      aria: "歷年全國電力資源供需報告的用電量預測趨勢",
      years: historicYears, step: 250, rotateTicks: true,
      series: [
        { name: "歷年實績", values: actual, color: "var(--text-primary)", labelOffset: 4, valueLabelIndices: [0,2,4,6], valueLabelOffset: -10, endLabel: false },
        { name: "112 年報告", values: nulls(5).concat([2757,2829,2869,2934,3026,3121,3227,3343,3443,3541,3641]).concat(nulls(2)), color: "var(--accent-2)", dash: "5 4", labelOffset: -4, valueLabelIndices: [15], valueLabelOffset: -10, endLabel: false },
        { name: "113 年報告", values: nulls(6).concat([2838,2849,2890,2929,2970,3020,3072,3135,3203,3286,3372]).concat(nulls(1)), color: "var(--accent-3)", dash: "5 4", labelOffset: -4, valueLabelIndices: [16], valueLabelOffset: 16, endLabel: false },
        { name: "114 年報告", values: nulls(7).concat([2830.1,2900,2972,3045,3120,3197,3276,3357,3440,3525,3621]), color: "var(--accent)", dash: "5 4", labelOffset: 12, valueLabelIndices: [17], valueLabelOffset: -10, endLabel: false }
      ]
    });
  }

  // ---------- Pane: Explorer ----------
  let sortState = { key: "台灣用電量_kWh", dir: -1 };
  const explorerCompanies = [...new Set(step5final.map(r => r["公司名稱"]))];
  const explorerYears = [...new Set(step5final.map(r => r["資料年度"]))].sort();
  function renderExplorer() {
    const sec = document.createElement("section");
    sec.className = "pane";
    sec.id = "pane-explorer";
    sec.innerHTML = `
      <h2 class="pane-title">數據瀏覽</h2>
      <p class="pane-desc">Step5最終50家名單逐筆資料，可依公司／年度篩選、點欄名排序。「台灣用電量」是逐家查證後的確認數字；「Step4估算年用電量」是篩選階段的粗估值(消耗能源總量×外購電力%，通常為集團/全球口徑)，兩欄並列可看出差距。</p>
      <div class="filters">
        <label>公司
          <select id="f-company"><option value="">全部</option>${explorerCompanies.map(c => `<option value="${c}">${c}</option>`).join("")}</select>
        </label>
        <label>年度

            <th data-k="資料年度">年度</th>
            <th data-k="台灣用電量_kWh">台灣用電量(度)<span class="th-sub">公司揭露或GHG反推</span></th>
            <th data-k="Step4估算年用電量_kWh">Step4估算年用電量(度)<span class="th-sub">消耗能源總量×外購電力%</span></th>
            <th data-k="_re">台灣RE比例</th>
            <th data-k="範疇一_公噸CO2e">範疇一(公噸CO2e)<span class="th-sub">直接排放</span></th>
            <th data-k="範疇二_公噸CO2e">範疇二(公噸CO2e)<span class="th-sub">外購電力</span></th>
            <th data-k="範疇三_公噸CO2e">範疇三(公噸CO2e)<span class="th-sub">供應鏈上下游</span></th>
            <th>詳細</th>
          </tr></thead>
          <tbody id="explorer-body"></tbody>
        </table>
      </div>
      <p class="footnote">範疇一/二/三單位皆為公噸CO2e，為ESG平台申報之集團/全球口徑溫室氣體排放，非台灣專屬數字，僅供參考公司整體排放規模。<b>範疇三(供應鏈上下游)</b>指公司自己不直接排放、但整條價值鏈上下游造成的間接排放，例如：上游——買的原物料/零組件在製造過程中的排放；下游——賣出的產品未來被使用時的排放(如晶片裝進手機後，手機用電產生的排放)；還有員工通勤、商務出差、廢棄物處理等。因為公司自己管不到供應商或消費者怎麼排放，範疇三數字通常最大，但跟公司自身用電量無直接關係，這個任務不需要用到。點「詳細」看資料拆分方式、備註、減量目標與達成進度原文。</p>

    `;
    panesEl.appendChild(sec);

    document.getElementById("f-company").onchange = drawExplorer;
    document.getElementById("f-year").onchange = drawExplorer;
    sec.querySelectorAll("th[data-k]").forEach(th => {
      th.onclick = () => {
        const k = th.dataset.k;
        sortState.dir = (sortState.key === k) ? -sortState.dir : 1;
        sortState.key = k;
        drawExplorer();
      };
    });
    drawExplorer();
  }

  function drawExplorer() {
    const fc = document.getElementById("f-company").value;
    const fy = document.getElementById("f-year").value;
    let rows = step5final.filter(r => (!fc || r["公司名稱"] === fc) && (!fy || String(r["資料年度"]) === fy));
    rows = rows.slice().sort((a, b) => {
      const av = sortState.key === "_re" ? a["台灣RE比例(%)"] : a[sortState.key];
      const bv = sortState.key === "_re" ? b["台灣RE比例(%)"] : b[sortState.key];
      const an = Number(av), bn = Number(bv);
      const aNum = av !== "" && av !== null && av !== undefined && !isNaN(an), bNum = bv !== "" && bv !== null && bv !== undefined && !isNaN(bn);
      if (!aNum && !bNum) return String(av || "").localeCompare(String(bv || ""), "zh-TW") * sortState.dir;
      if (!aNum) return 1;
      if (!bNum) return -1;
      return (an - bn) * sortState.dir;
    });
    const body = document.getElementById("explorer-body");
    body.innerHTML = rows.map(r => {
      const rangePill = r["是否為RANGE估算"] === "是"
        ? `<span class="pill na" style="background:color-mix(in oklab, var(--warn) 20%, transparent);color:var(--warn)">RANGE估算</span>`
        : `<span class="pill ok">單一值</span>`;
      const re = r["台灣RE比例(%)"] && !isNaN(Number(r["台灣RE比例(%)"])) ? Number(r["台灣RE比例(%)"]).toLocaleString("zh-TW", { maximumFractionDigits: 2 }) + "%" : (r["台灣RE比例(%)"] || "—");
      const groupRe = r["集團RE使用率(%)"] === null ? "—" : fmt(r["集團RE使用率(%)"], 2) + "%";
      const target = r["減量目標原文"] || "";
      const progress = r["達成進度原文"] || "";
      const detailBody = [
        `<b>拆分方式：</b>${esc(r["資料拆分方式"])}`,
        `<b>備註：</b>${esc(r["備註"])}`,
        `<b>集團/全球RE使用率：</b>${groupRe}（ESG平台原始欄位，非台灣專屬）`,
        `<b>消耗能源總量：</b>${fmt(r["消耗能源總量_GJ"])} GJ　<b>外購電力%：</b>${r["外購電力百分比(%)"] === null ? "—" : fmt(r["外購電力百分比(%)"], 2) + "%"}`,
        (target || progress) ? `<b>減量目標：</b>${esc(target)}${target && progress ? "\n\n<b>達成進度：</b>" + esc(progress) : esc(progress)}` : "",
      ].filter(Boolean).join("\n\n");
      return `<tr>
        <td>${r["公司名稱"]} <span class="badge-src">${r["公司代號"]}</span></td>
        <td class="num">${r["資料年度"]}</td>
        <td class="num">${fmt(Number(r["台灣用電量_kWh"]))}<br>${rangePill}</td>
        <td class="num">${fmt(r["Step4估算年用電量_kWh"])}</td>
        <td class="num">${re}</td>
        <td class="num">${fmt(r["範疇一_公噸CO2e"])}</td>
        <td class="num">${fmt(r["範疇二_公噸CO2e"])}</td>
        <td class="num">${fmt(r["範疇三_公噸CO2e"])}</td>
        <td>
          <details class="rowdetail">
            <summary>詳細</summary>
            <div class="body">${detailBody}</div>
          </details>
        </td>
      </tr>`;
    }).join("") || `<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:24px">沒有符合條件的資料</td></tr>`;
  }

  function esc(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  // ---------- Pane: Charts ----------

  function renderCharts() {

    sec.innerHTML = `

        <h3>各公司台灣用電量(度)</h3>
        <div class="legend">
          <span><span class="sw" style="background:var(--accent)"></span>單一值(公司直接揭露或明確係數反推)</span>
          <span><span class="sw" style="background:var(--warn)"></span>RANGE估算(係數版本不明，取上下界中點)</span>
        </div>
        <div class="barlist">${barsElec}</div>

      <div class="card">

  // ---------- Pane: Step5 final list ----------
  function renderStep5() {

        <td>
          <details class="rowdetail">

    const exclRows = step5excluded.map(r => `<tr>

      <div class="kpi-grid">

        <div class="kpi"><div class="val">${top10Pct}%</div><div class="lbl">前10大占比</div><div class="note">帕累托效應：前10家＝${top10Pct}%總量</div></div>
        <div class="kpi"><div class="val">${rangeCount}</div><div class="lbl">RANGE估算家數</div><div class="note">未載明排碳係數版本，取上下界</div></div>

        <div class="table-scroll">
          <table class="data">
            <thead><tr><th>公司</th><th>2023用電量<br><span class="th-sub">億度</span></th><th>2024用電量<br><span class="th-sub">億度</span></th><th>2025用電量<br><span class="th-sub">億度</span></th><th>台灣RE比例<br><span class="th-sub">2025年度</span></th><th>說明</th></tr></thead>

      const listPillStyle = r["所屬名單"] === "最終50家" ? "ok" : "na";
      return `<tr>
        <td>${r["公司名稱"]} <span class="badge-src">${r["公司代號"]}</span></td>
        <td class="num">${r["資料年度"]}</td>
        <td><span class="pill ${listPillStyle}">${r["所屬名單"]}</span></td>
        <td><span class="pill ${pillClass}">${r["是否有PDF"]}</span></td>
        <td class="num">${size}</td>
        <td>${link}${r["備註"] ? `<div style="font-size:11px;color:var(--text-muted);margin-top:3px;max-width:32ch">${r["備註"]}</div>` : ""}</td>
      </tr>`;
    }).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:24px">沒有符合條件的資料</td></tr>`;
  }

  // ---------- boot ----------
  renderOverview();
  renderCriteria();
  renderStep5();
  renderExplorer();
  renderCharts();
  renderFiles();
  renderMethod3();
  renderScenario();

  let saved = "overview";
  try { saved = localStorage.getItem("wdh-tab") || "overview"; } catch (e) {}
  switchTab(saved);

  // ---------- anchor links inside collapsed <details> should auto-open + scroll ----------
  function revealHashTarget() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (!id) return;
    const el = document.getElementById(id);
    if (!el) return;
    let d = el.closest("details");
    while (d) { d.open = true; d = d.parentElement && d.parentElement.closest("details"); }
    requestAnimationFrame(() => el.scrollIntoView({ block: "center" }));
  }
  window.addEventListener("hashchange", revealHashTarget);
  document.addEventListener("click", (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const id = a.getAttribute("href").slice(1);
    if (!id) return;
    if (location.hash === "#" + id) revealHashTarget();
  });
  if (location.hash) revealHashTarget();
})();
</script>
